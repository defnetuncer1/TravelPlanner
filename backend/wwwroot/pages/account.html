<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Login/Register </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel ="stylesheet" href = "../css/style.css">

</head>

<body>
    <nav class="navbar navbar-expand-sm custom-navbar">
        <div class="container-fluid">
            <ul class="navbar-nav nav-tabs custom-nav">
                
                <li class="nav-item">
                    <a class ="nav-link" href="home.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="places.html">Destinations</a>
                </li>
                <li class ="nav-item">
                    <a class="nav-link" href="plans.html">Plans</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="account.html">Login/Register</a>
                </li>
               
            </ul>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row account-box">
            <div class="col-md-6 register-side">
                <h3 class="text-center mb-4">Register</h3>
                <form id="registerForm">
                    <div class="p-3">
                        <label for="fullName" class="form-label">Full Name: </label>
                        <input type="text" class="form-control" id="fullName" placeholder="Enter full name" name="fullName">
                    </div>
                    <div class="p-3">
                        <label for="registerEmail" class="form-label">Email: </label>
                        <input type="email" class="form-control" id="registerEmail" placeholder="Enter email" name="registerEmail">
                    </div>
                    <div class="p-3">
                        <label for="registerPassword" class="form-label">Password: </label>
                        <input type="password" class="form-control" id="registerPassword" placeholder="Create a password" name="registerPassword">
                    </div>
                    <div class="p-3">
                        <label for="confirmPassword" class="form-label">Confirm Password:</label>
                        <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Confirm password:">
                    </div>
                    <button type="submit" class="custom-button mt-3">Register</button>
                    <p id="registerMessage" class="mt-3 text-center"></p>
                </form>
            </div>

            <div class="col-md-6 login-side">
                <h3 class="text-center mb-4">Login</h3>
                <form id="loginForm">
                    <div class=" p-3">
                        <label for="loginEmail" class="form-label">Email: </label>
                        <input type="email" class="form-control" id="loginEmail" placeholder="Enter email" name="loginEmail">
                    </div>
                    <div class=" p-3">
                        <label for="loginPassword" class="form-label">Password: </label>
                        <input type="password" class="form-control" id="loginPassword" placeholder="Enter password" name="loginPassword">
                    </div>
                    <div class="form-check p-3">
                        <label class="form-check-label p-4">
                            <input class="form-check-input" type="checkbox" name="remember">Remember me
                        </label>
                    </div>
                    <button type="submit" class="custom-button mt-3">Login</button>
                    <p id="loginMessage" class="mt-3 text-center"></p>
                </form>
            </div>
</div>
    </div><footer class="custom-footer mt-5">
    <div class="container-fluid text-center">
        <h5>Personal Travel Planner</h5>
        <p>Discover places, create travel plans and organize your trips easily.</p>
        <p class="mb-0">2026 Personal Travel Planner | SENG 216 Web Programming Project</p>
    </div>
</footer>
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>
</body>
</html>
