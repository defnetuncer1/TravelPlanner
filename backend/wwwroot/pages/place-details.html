<div class="modal fade" id="addToPlanModal" tabindex="-1" aria-labelledby="addToPlanModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addToPlanModalLabel">Add Place to Plan</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <label for="planSelect" class="form-label">Choose one of your plans:</label>
                <select class="form-select" id="planSelect">
                    <option selected disabled>Select a plan</option>
                </select>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="custom-button" data-bs-dismiss="modal" id="confirmAddToPlan">
                    Add to Selected Plan
                </button>
            </div>
        </div>
    </div>
</div>
